<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>PaymentSucces - Sirip Juara</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #293B6D;
      --blue-footer: #1c2d5c;
      --surface:     #ffffff;
      --surface-soft:#f0f4fb;   
      --border:      #d8e2f2;
      --text-dark:   #1e3057;
      --text-muted:  #6b83ad;
      --accent:      #2d4f9f;
    }

    body {
      font-family: 'Poppins';
      background: #fff;
      color: var(--text-dark);
      padding-top: 96px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img { max-width: 100%; display: block; }
    a   { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    .container {
      width: min(1320px, calc(100% - 80px));
      margin: 0 auto;
    }

    .hidden { display: none !important; }


    .main {
    display: flex;
    align-items: center;
    justify-content: center;

    padding-top: 50px;
    padding-bottom: 60px;
    padding-left: 24px;
    padding-right: 24px;

    background: #fff;
}

        /* ── SUCCESS CARD ── */
        .success-card {
            background: #f5f8ff;
            border: 1px solid #11182795;
            border-radius: 20px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .check-circle {
            width: 64px;
            height: 64px;
            background: #3D588B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
        }
        .check-circle svg {
            width: 32px;
            height: 32px;
        }

        .success-title {
            font-size: 22px;
            font-weight: 450;
            color: #3D588B;
            margin-bottom: 40px;
        }

        .success-amount {
            font-size: 26px;
            font-weight: 700;
            color: #3D588B;
            margin-bottom: 16px;
        }

        .order-id {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.5px;
    color: #3D588B;
    margin-bottom: 45px;
}

        .back-btn {
            display: inline-block;
            background: #3B5380;
            color: white;
            border: none;
            padding: 9px 50px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .back-btn:hover { background: #1f2a52; transform: scale(1.02); }



    </style>
</head>
<body>


<!-- MAIN -->
<main class="main">
    <div class="success-card">
        <div class="check-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-title">Payment Successful</div>
        <div class="success-amount" id="successAmount"></div>
        <div class="order-id" id="orderId"></div>
        <a href="trackuorder.html" class="back-btn">Check Your Order</a>
    </div>
</main>



<script>

    ///
    const order = JSON.parse(
      localStorage.getItem("sj_last_order") || "{}"
    );

    if(order.name){
      
    const total = order.total || ((order.price || 0) * (order.qty || 1) + 10000 - 5000);

    document.getElementById("successAmount").textContent =
      "Rp " + total.toLocaleString("id-ID");

      document.getElementById("orderId")
        .textContent =
        "Order ID #" +
        Math.random()
          .toString(36)
          .substring(2,10)
          .toUpperCase();
    }
</script>

</body>
</html>
